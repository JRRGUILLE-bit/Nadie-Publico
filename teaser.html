<!doctype html>
<html lang="es-UY">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nadie te dijo que iba a ser así | Teaser</title>
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="theme-color" content="#101b18" />
    <link rel="icon" href="assets/ntdqiasa-flame-favicon-assets/favicon.ico" sizes="any" />
    <link rel="icon" href="assets/ntdqiasa-flame-favicon-assets/ntdqiasa-flame-favicon-32.png" type="image/png" />
    <link rel="stylesheet" href="project-page.css?v=2" />
    <link rel="stylesheet" href="video.css?v=2" />
    <style>
      body {
        position: relative;
        min-height: 100vh;
        background: #101b18 url('assets/ntdqiasa_video_v5_assets/ntdqiasa_video_v5_poster.jpg') center center / cover fixed no-repeat;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.58);
        z-index: 0;
        pointer-events: none;
      }
      main { position: relative; z-index: 1; }
    </style>
  </head>
  <body>
    <main>
      <article class="video-page">
        <header class="video-header">
          <p class="eyebrow">Nadie te dijo que iba a ser así</p>
          <h1>Teaser</h1>
        </header>

        <section class="video-frame" aria-label="Video de YouTube">
          <div id="youtube-container" class="youtube-container">
            <div class="video-placeholder">
              <span>TEASER</span>
              <strong>Próximamente</strong>
            </div>
          </div>
        </section>
      </article>
    </main>

    <script>
      const YOUTUBE_VIDEO_ID = '';

      if (YOUTUBE_VIDEO_ID) {
        const container = document.getElementById('youtube-container');
        const iframe = document.createElement('iframe');
        iframe.src = `https://www.youtube-nocookie.com/embed/${encodeURIComponent(YOUTUBE_VIDEO_ID)}`;
        iframe.title = 'Nadie te dijo que iba a ser así — Teaser';
        iframe.loading = 'lazy';
        iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
        iframe.allowFullscreen = true;
        container.replaceChildren(iframe);
      }
    </script>
  </body>
</html>
