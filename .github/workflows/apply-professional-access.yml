name: Apply professional access labels

on:
  push:
    paths:
      - ".github/workflows/apply-professional-access.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch professional access labels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          script_path = Path('script.js')
          script = script_path.read_text(encoding='utf-8')

          marker = "const plateNameClass = 'plate__name';\n"
          addition = marker + "const productionEmail = 'malenabh1@gmail.com';\n"
          if "const productionEmail" not in script:
              if marker not in script:
                  raise SystemExit('No se encontró el marcador de productionEmail')
              script = script.replace(marker, addition, 1)

          old_list_end = """      <li>Distribución y ventas, cuando corresponda a la etapa.</li>
    </ul>
  `;"""
          new_list_end = """      <li>Distribución y ventas, cuando corresponda a la etapa.</li>
    </ul>
    <div class=\"project-partner-search__actions\" aria-label=\"Acciones de contacto profesional\">
      <a href=\"mailto:${productionEmail}?subject=Contacto%20de%20producci%C3%B3n%20%E2%80%94%20Nadie%20te%20dijo%20que%20iba%20a%20ser%20as%C3%AD&body=Hola%2C%0A%0AQuisiera%20ponerme%20en%20contacto%20con%20producci%C3%B3n%20por%20Nadie%20te%20dijo%20que%20iba%20a%20ser%20as%C3%AD.%0A%0ANombre%20%2F%20empresa%3A%0AMotivo%20del%20contacto%3A%0A%0ASaludos.\">Contacto de producción</a>
      <a class=\"project-partner-search__action--primary\" href=\"mailto:${productionEmail}?subject=Conversaci%C3%B3n%20de%20coproducci%C3%B3n%20%E2%80%94%20Nadie%20te%20dijo%20que%20iba%20a%20ser%20as%C3%AD&body=Hola%2C%0A%0AMe%20interesa%20conversar%20sobre%20una%20posible%20coproducci%C3%B3n%20o%20alianza%20para%20Nadie%20te%20dijo%20que%20iba%20a%20ser%20as%C3%AD.%0A%0ANombre%20%2F%20empresa%3A%0APa%C3%ADs%3A%0AMotivo%20del%20contacto%3A%0A%0ASaludos.\">Conversar sobre coproducción</a>
    </div>
  `;"""
          if 'project-partner-search__actions' not in script:
              if old_list_end not in script:
                  raise SystemExit('No se encontró el cierre de la lista de socios')
              script = script.replace(old_list_end, new_list_end, 1)

          old_css_end = """      .project-partner-search__list li::before {
        content: '›';
        position: absolute;
        left: 0.08rem;
        color: #d8b879;
        font-weight: 700;
      }
    `;"""
          new_css_end = """      .project-partner-search__list li::before {
        content: '›';
        position: absolute;
        left: 0.08rem;
        color: #d8b879;
        font-weight: 700;
      }

      .project-partner-search__actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.55rem;
        margin-top: 0.9rem;
      }

      .project-partner-search__actions a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.45rem;
        padding: 0.52rem 0.72rem 0.46rem;
        border: 1px solid rgba(238, 224, 194, 0.34);
        color: #eadbb9;
        background: rgba(7, 9, 8, 0.52);
        font-family: 'Special Elite', 'Courier Prime', 'Courier New', Courier, monospace;
        font-size: clamp(0.66rem, 1.3vw, 0.78rem);
        letter-spacing: 0.055em;
        line-height: 1.2;
        text-align: center;
        text-decoration: none;
        text-transform: uppercase;
        transition: border-color 180ms ease, background 180ms ease, transform 180ms ease;
      }

      .project-partner-search__actions a:hover,
      .project-partner-search__actions a:focus-visible {
        border-color: rgba(255, 224, 158, 0.76);
        background: rgba(31, 23, 12, 0.74);
        transform: translateY(-1px);
        outline: none;
      }

      .project-partner-search__actions .project-partner-search__action--primary {
        border-color: rgba(216, 184, 121, 0.7);
        background:
          linear-gradient(145deg, rgba(160, 108, 35, 0.24), transparent 66%),
          rgba(17, 13, 8, 0.72);
      }
    `;"""
          if '.project-partner-search__actions {' not in script:
              if old_css_end not in script:
                  raise SystemExit('No se encontró el cierre CSS de búsqueda de socios')
              script = script.replace(old_css_end, new_css_end, 1)

          calls_marker = """addProjectStatusBlock();
addProjectPartnerSearchBlock();
setAboutSlide(0);"""
          configure_function = """const configureProfessionalAccessLabels = () => {
  const materialLink = document.querySelector('.contact-links a[href^=\"mailto:\"]');
  const materialLabel = materialLink?.querySelector('span');
  const materialIcon = materialLink?.querySelector('img');
  const aboutLabel = aboutTrigger?.querySelector('span');
  const aboutIcon = aboutTrigger?.querySelector('img');

  if (materialLink) {
    materialLink.href = 'mailto:' + productionEmail + '?subject=Solicitud%20de%20dossier%20y%20materiales%20%E2%80%94%20Nadie%20te%20dijo%20que%20iba%20a%20ser%20as%C3%AD&body=Hola%2C%0A%0AQuisiera%20solicitar%20el%20dossier%20y%20los%20materiales%20disponibles%20de%20Nadie%20te%20dijo%20que%20iba%20a%20ser%20as%C3%AD.%0A%0ANombre%20%2F%20empresa%3A%0APa%C3%ADs%3A%0AMotivo%20del%20inter%C3%A9s%3A%0A%0ASaludos.';
    materialLink.setAttribute('aria-label', 'Contacto de producción: solicitar dossier y materiales');
  }

  if (materialLabel) materialLabel.textContent = 'Contacto de producción';
  if (materialIcon) materialIcon.alt = 'Contacto de producción y solicitud de materiales';
  if (aboutLabel) aboutLabel.textContent = 'Proyecto y equipo';
  if (aboutIcon) aboutIcon.alt = 'Proyecto y equipo';
  aboutTrigger?.setAttribute('aria-label', 'Abrir proyecto y equipo');
};

configureProfessionalAccessLabels();
addProjectStatusBlock();
addProjectPartnerSearchBlock();
setAboutSlide(0);"""
          if 'configureProfessionalAccessLabels' not in script:
              if calls_marker not in script:
                  raise SystemExit('No se encontró el bloque final de llamadas')
              script = script.replace(calls_marker, configure_function, 1)

          script_path.write_text(script, encoding='utf-8')

          todo_path = Path('TODO.md')
          todo = todo_path.read_text(encoding='utf-8')
          todo = todo.replace(
              '- [ ] 4. Mejorar los nombres de los accesos profesionales.',
              '- [x] 4. Mejorar los nombres de los accesos profesionales.',
              1,
          )
          todo = todo.replace(
              '  - Agregar “Conversar sobre coproducción”.',
              '  - Agregar “Conversar sobre coproducción”.\n  - Implementado con accesos separados y correos precompletados.',
              1,
          )
          todo_path.write_text(todo, encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: node --check script.js

      - name: Commit changes and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-professional-access.yml
          git add script.js TODO.md
          git commit -m "Improve professional access labels"
          git push
