name: Repository-wide bug audit

on:
  push:
    branches:
      - qa-repo-audit-20260822
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/repo-audit-http.log 2>&1 &
          echo $! > /tmp/repo-audit-http.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/repo-audit-http.log
          exit 1

      - name: Run repository audit
        id: audit
        continue-on-error: true
        env:
          QA_BASE_URL: http://127.0.0.1:4173
          QA_OUT_DIR: qa-repo-audit-results
        run: node qa/repo-audit.mjs

      - name: Copy server log
        if: always()
        run: cp /tmp/repo-audit-http.log qa-repo-audit-results/http-server.log || true

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo-audit-evidence
          path: qa-repo-audit-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce audit result
        if: steps.audit.outcome == 'failure'
        run: exit 1
