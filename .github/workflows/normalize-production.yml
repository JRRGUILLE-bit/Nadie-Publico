name: Normalize production slides

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, '[production-normalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize production stylesheet version
        shell: python
        run: |
          from pathlib import Path
          import re

          for filename in ('index.html', 'english.html'):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              updated = re.sub(r'malena-slide\.css\?v=\d+', 'malena-slide.css?v=4', text)
              path.write_text(updated, encoding='utf-8')

      - name: Commit normalized production stylesheet version
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html english.html
          git diff --cached --quiet && exit 0
          git commit -m "[production-normalized] Use production stylesheet v4"
          git push
