name: Sync series duration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update duration everywhere
        shell: bash
        run: |
          set -e
          files=$(grep -RIl --exclude-dir=.git \
            -e '20–25' \
            -e '20 a 25' \
            -e '20 to 25' \
            . || true)
          if [ -n "$files" ]; then
            while IFS= read -r file; do
              [ "$file" = "./.github/workflows/_sync-duration.yml" ] && continue
              case "$file" in
                *.html|*.md|*.txt|*.xml|*.json|*.js)
                  sed -i \
                    -e 's/6×20–25/6×35/g' \
                    -e 's/6 × 20–25/6 × 35/g' \
                    -e 's/20–25 minutes/35 minutes/g' \
                    -e 's/20–25 min/35 min/g' \
                    -e 's/20–25\x27/35\x27/g' \
                    -e 's/20 a 25 minutos/35 minutos/g' \
                    -e 's/20 to 25 minutes/35 minutes/g' \
                    "$file"
                  ;;
              esac
            done <<< "$files"
          fi
          rm -f .github/workflows/_sync-duration.yml
      - name: Commit synchronized duration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update series episode duration to 35 minutes"
          git push
