name: Add Malena production slide to English page
on:
  push:
    branches: [main]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add production slide and navigation dot
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('english.html')
          s = p.read_text(encoding='utf-8')
          marker = '''            <article class="about-card about-card--journey" id="about-journey" data-about-slide data-slide-key="recorrido">'''
          slide = '''            <article class="about-card about-card--malena about-card--creators" id="about-malena" data-about-slide data-slide-key="malena"><h2 tabindex="-1">PRODUCTION</h2><div class="malena-profile"><p>Malena Benavides is the executive producer of <em>Nadie te dijo que iba a ser así</em>. Her work connects project development, production organization and relationships with creators, partners and professional spaces.</p><p>She trained at Universidad Católica del Uruguay and works in the audiovisual field. She produced the documentary <em>Tumbero</em> and currently works with Pardelion Films. On <em>Nadie te dijo que iba a ser así</em>, she supports the project through its development and path toward production.</p></div></article>\n'''
          if 'id="about-malena"' not in s:
              if marker not in s:
                  raise SystemExit('Journey slide marker not found')
              s = s.replace(marker, slide + marker, 1)
          dot_old = '<button class="about-carousel__dot" type="button" data-about-dot>SKA FILMS</button><button class="about-carousel__dot" type="button" data-about-dot>TRACK RECORD</button>'
          dot_new = '<button class="about-carousel__dot" type="button" data-about-dot>SKA FILMS</button><button class="about-carousel__dot" type="button" data-about-dot>PRODUCTION</button><button class="about-carousel__dot" type="button" data-about-dot>TRACK RECORD</button>'
          if 'data-about-dot>PRODUCTION</button>' not in s:
              if dot_old not in s:
                  raise SystemExit('English navigation dots marker not found')
              s = s.replace(dot_old, dot_new, 1)
          s = s.replace('01 / 08 — PROJECT', '01 / 09 — PROJECT', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add english.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            git rm .github/workflows/_add-malena-english.yml
            git commit -m "Remove temporary Malena English slide workflow"
          else
            git commit -m "Add Malena production slide to English page"
            git rm .github/workflows/_add-malena-english.yml
            git commit -m "Remove temporary Malena English slide workflow"
          fi
          git push
