name: Install GoatCounter analytics

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install-analytics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add GoatCounter to every HTML page
        run: |
          python3 - <<'PY'
          from pathlib import Path

          snippet = '''    <script data-goatcounter="https://jrrguille.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>'''

          changed = []
          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              if 'data-goatcounter="https://jrrguille.goatcounter.com/count"' in text:
                  continue
              if '</head>' not in text:
                  continue
              path.write_text(text.replace('</head>', snippet + '\n  </head>', 1), encoding='utf-8')
              changed.append(str(path))

          print('Updated:', ', '.join(changed) if changed else 'none')
          PY

      - name: Commit analytics changes and remove installer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/install-goatcounter.yml
          git add '*.html' '**/*.html' 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Install GoatCounter analytics on all site pages"
          git push
