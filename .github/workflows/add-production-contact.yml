name: Add production contact access

on:
  push:
    paths:
      - ".github/workflows/add-production-contact.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add production contact access
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('script.js')
          text = path.read_text(encoding='utf-8')

          marker = """  if (contactNav && materialsLink && !contactNav.querySelector('.contact-link--coproduction')) {
    const coproductionLink = document.createElement('a');"""

          replacement = """  let productionLink = contactNav?.querySelector('.contact-link--production');

  if (contactNav && materialsLink && !productionLink) {
    productionLink = document.createElement('a');
    productionLink.className = 'contact-link contact-link--production';
    productionLink.href = createMailto(
      'Contacto de producción — Nadie te dijo que iba a ser así',
      'Hola,\\n\\nQuisiera ponerme en contacto con producción por Nadie te dijo que iba a ser así.\\n\\nNombre:\\nEmpresa / institución:\\nMotivo del contacto:\\n\\nSaludos,'
    );
    productionLink.innerHTML = `
      <img src=\"assets/logos/email-icon.png\" alt=\"Contacto de producción\" />
      <span>Contacto de producción</span>
    `;
    materialsLink.insertAdjacentElement('afterend', productionLink);
  }

  if (contactNav && materialsLink && !contactNav.querySelector('.contact-link--coproduction')) {
    const coproductionLink = document.createElement('a');"""

          if "contact-link--production" not in text:
              if marker not in text:
                  raise SystemExit('No se encontró el marcador de coproducción')
              text = text.replace(marker, replacement, 1)

          old_insert = "    materialsLink.insertAdjacentElement('afterend', coproductionLink);"
          new_insert = "    (productionLink || materialsLink).insertAdjacentElement('afterend', coproductionLink);"
          if old_insert in text:
              text = text.replace(old_insert, new_insert, 1)

          path.write_text(text, encoding='utf-8')

          todo_path = Path('TODO.md')
          todo = todo_path.read_text(encoding='utf-8')
          todo = todo.replace(
              '  - El acceso de correo quedó identificado como “Solicitar dossier y materiales”.',
              '  - Se mantuvo “Solicitar dossier y materiales” y se agregó “Contacto de producción” como acceso general.',
              1,
          )
          todo_path.write_text(todo, encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: node --check script.js

      - name: Commit changes and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-production-contact.yml
          git add script.js TODO.md
          git commit -m "Add general production contact access"
          git push
