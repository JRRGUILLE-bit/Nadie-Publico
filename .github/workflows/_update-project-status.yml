name: Update project status
run-name: Update project status final retry

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update audience and teaser status
        run: |
          python - <<'PY'
          from pathlib import Path

          def update_file(path, audience_prefix, audience_line):
              p = Path(path)
              lines = p.read_text(encoding="utf-8").splitlines(keepends=True)
              found_audience = False
              found_teaser = False
              out = []
              for line in lines:
                  if "SECUNDARIA:" in line:
                      if audience_prefix in line:
                          newline = "\n" if line.endswith("\n") else ""
                          line = audience_line + newline
                          found_audience = True
                  if "teaser en producción" in line:
                      line = line.replace("teaser en producción", "teaser realizado")
                      found_teaser = True
                  out.append(line)
              if not found_audience:
                  raise SystemExit(f"No se encontró la línea de público secundario en {path}")
              if not found_teaser:
                  raise SystemExit(f"No se encontró 'teaser en producción' en {path}")
              p.write_text("".join(out), encoding="utf-8")

          update_file(
              "sobre.html",
              "SECUNDARIA:",
              "          <p><strong>SECUNDARIA: 35–55 + públicos hispanohablantes culturalmente próximos.</strong></p>"
          )
          update_file(
              "SITE_CONTENT_SOURCE.md",
              "SECUNDARIA:",
              "- **SECUNDARIA:** 35–55 + públicos hispanohablantes culturalmente próximos.\n"
          )
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sobre.html SITE_CONTENT_SOURCE.md
          git commit -m "Update audience and teaser status"
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          rm .github/workflows/_update-project-status.yml
          git add .github/workflows/_update-project-status.yml
          git commit -m "Remove temporary update workflow"
          git push
