name: Update project status
run-name: Update project status retry

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update audience and teaser status
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          sobre = Path("sobre.html")
          text = sobre.read_text(encoding="utf-8")
          text, n1 = re.subn(r"SECUNDARIA:\s*35\D+44", "SECUNDARIA: 35–55", text, count=1)
          text, n2 = re.subn(r"teaser en producción", "teaser realizado", text)
          if n1 == 0:
              raise SystemExit("No se encontró el rango de público secundario en sobre.html")
          if n2 == 0:
              raise SystemExit("No se encontró 'teaser en producción' en sobre.html")
          sobre.write_text(text, encoding="utf-8")

          source = Path("SITE_CONTENT_SOURCE.md")
          text = source.read_text(encoding="utf-8")
          text, n3 = re.subn(r"\*\*SECUNDARIA:\*\*\s*35\D+44", "**SECUNDARIA:** 35–55", text, count=1)
          text, n4 = re.subn(r"teaser en producción", "teaser realizado", text)
          if n3 == 0:
              raise SystemExit("No se encontró el rango de público secundario en SITE_CONTENT_SOURCE.md")
          if n4 == 0:
              raise SystemExit("No se encontró 'teaser en producción' en SITE_CONTENT_SOURCE.md")
          source.write_text(text, encoding="utf-8")
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sobre.html SITE_CONTENT_SOURCE.md
          git commit -m "Update audience and teaser status"
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          rm .github/workflows/_update-project-status.yml
          git add .github/workflows/_update-project-status.yml
          git commit -m "Remove temporary update workflow"
          git push
