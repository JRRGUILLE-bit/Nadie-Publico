name: Update project status
run-name: Update project status robust

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update audience and teaser status
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("sobre.html")
          lines = p.read_text(encoding="utf-8").splitlines(keepends=True)
          out = []
          audience_done = False
          for line in lines:
              if "SECUNDARIA:" in line:
                  line = "          <p><strong>SECUNDARIA: 35–55 + públicos hispanohablantes culturalmente próximos.</strong></p>\n"
                  audience_done = True
              if '<span>Estado</span>' in line:
                  line = '            <div class="industrial-item"><span>Estado</span><strong>Piloto completo · temporada estructurada · teaser realizado</strong></div>\n'
              if '<strong>Teaser ' in line and 'material' in line:
                  line = '            <div class="material"><strong>Teaser realizado</strong></div>\n'
              if 'teaser' in line and 'SKA Films, coproducción uruguaya' in line:
                  line = line.replace('teaser en producción', 'teaser realizado')
              out.append(line)
          if not audience_done:
              raise SystemExit("No se encontró la línea de público secundario en sobre.html")
          p.write_text("".join(out), encoding="utf-8")

          p = Path("SITE_CONTENT_SOURCE.md")
          lines = p.read_text(encoding="utf-8").splitlines(keepends=True)
          out = []
          audience_done = False
          teaser_done = False
          for line in lines:
              if "**SECUNDARIA:**" in line:
                  line = "- **SECUNDARIA:** 35–55 + públicos hispanohablantes culturalmente próximos.\n"
                  audience_done = True
              if "teaser en producción" in line:
                  line = line.replace("teaser en producción", "teaser realizado")
                  teaser_done = True
              out.append(line)
          if not audience_done:
              raise SystemExit("No se encontró el público secundario en SITE_CONTENT_SOURCE.md")
          p.write_text("".join(out), encoding="utf-8")
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sobre.html SITE_CONTENT_SOURCE.md
          git commit -m "Update audience and teaser status"
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          rm .github/workflows/_update-project-status.yml
          git add .github/workflows/_update-project-status.yml
          git commit -m "Remove temporary update workflow"
          git push
